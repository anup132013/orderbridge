<!DOCTYPE html>
<html>
<head>
<title>Distributor Dashboard - OrderBridge</title>

<style>

body{
font-family:Arial;
background:#f4f7f5;
margin:0;
}

.header{
background:#0f5132;
color:white;
padding:15px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

button{
background:#0f5132;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
}

a{
text-decoration:none;
color:#0f5132;
}
</style>

</head>

<body>

<div class="header">
<h1>Distributor Dashboard</h1>
</div>

<div class="container">

<div class="card">
<h3>Total Products</h3>
<p>54 Products</p>
</div>

<div class="card">
<h3>Orders Today</h3>
<p>12 Orders</p>
</div>

<div class="card">
<h3>Inventory Status</h3>
<p>All Products In Stock</p>
</div>

<div class="card">
<h3>Add Product</h3>

<input placeholder="Product Name">

<br><br>

<button>Add Product</button>

</div>

<br>

<a href="index.html">← Back Home</a>

</div>

</body>
</html>
